<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0757c9">
<link rel="manifest" href="manifest.json">
<title>Digital World Computer - CSC Work Register</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f3f6fb;color:#172033}
header{background:linear-gradient(135deg,#063d91,#0878e8);color:#fff;padding:16px;text-align:center}
header img{width:92px;height:92px;object-fit:cover;border-radius:18px;background:#fff;padding:3px}
header h1{font-size:22px;margin:8px 0 2px}header p{margin:0;font-size:13px}
.container{max-width:900px;margin:auto;padding:14px}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.card{background:#fff;border-radius:15px;padding:15px;box-shadow:0 3px 12px #0001;text-align:center}
.card b{display:block;font-size:22px;margin-top:5px}.paid{color:#07833b}.due{color:#d33b2f}.total{color:#0757c9}
.panel{background:#fff;border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 3px 12px #0001}
h2{font-size:18px;margin:0 0 12px}label{font-size:13px;font-weight:bold}
input,select{width:100%;padding:12px;border:1px solid #d5dce8;border-radius:10px;margin:5px 0 10px;font-size:15px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button{border:0;border-radius:10px;padding:12px 15px;font-weight:bold;cursor:pointer}
.primary{background:#0757c9;color:#fff}.green{background:#0a9b50;color:#fff}.red{background:#e34234;color:#fff}.gray{background:#e9eef6;color:#172033}
.item{border:1px solid #e0e6ef;border-radius:13px;padding:12px;margin:9px 0;background:#fbfcff}
.item-top{display:flex;justify-content:space-between;gap:8px;align-items:center}.name{font-weight:bold;font-size:16px}
.badge{padding:5px 8px;border-radius:20px;font-size:12px;font-weight:bold}.badge.p{background:#dff7e9;color:#08743a}.badge.d{background:#ffe3e0;color:#b72b21}
.actions{display:flex;gap:7px;margin-top:9px;flex-wrap:wrap}.actions button{padding:8px 10px;font-size:12px}
.empty{text-align:center;color:#687386;padding:20px}
@media(max-width:600px){.cards{grid-template-columns:1fr 1fr 1fr}.card{padding:10px;font-size:12px}.card b{font-size:18px}.row{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
<img src="logo.jpg" alt="Digital World Computer">
<h1>Digital World Computer</h1>
<p>Common Service Center • Work Register • Customer Paid & Due</p>
</header>
<div class="container">
<div class="cards">
<div class="card total">Total Work<b id="totalWork">0</b></div>
<div class="card paid">Customer Paid<b>₹<span id="totalPaid">0</span></b></div>
<div class="card due">Customer Due<b>₹<span id="totalDue">0</span></b></div>
</div>

<div class="panel">
<h2>➕ नया Work Register</h2>
<div class="row">
<div><label>Customer Name</label><input id="name" placeholder="ग्राहक का नाम"></div>
<div><label>Mobile Number</label><input id="mobile" inputmode="numeric" placeholder="मोबाइल नंबर"></div>
</div>
<div class="row">
<div><label>Work / Service</label><input id="work" placeholder="जैसे Aadhaar, PAN, Print"></div>
<div><label>Total Amount (₹)</label><input id="amount" type="number" min="0" placeholder="0"></div>
</div>
<div><label>Paid Amount (₹)</label><input id="paid" type="number" min="0" placeholder="0"></div>
<button class="primary" onclick="addWork()">💾 Save Work</button>
<button class="gray" onclick="clearForm()">Clear</button>
</div>

<div class="panel">
<h2>📋 Work Register</h2>
<input id="search" oninput="render()" placeholder="🔎 Customer / Mobile / Work search...">
<div id="list"></div>
</div>
</div>

<script>
let data=JSON.parse(localStorage.getItem('dw_work_register')||'[]');
function money(n){return Number(n||0).toLocaleString('en-IN')}
function save(){localStorage.setItem('dw_work_register',JSON.stringify(data));render()}
function clearForm(){['name','mobile','work','amount','paid'].forEach(id=>document.getElementById(id).value='')}
function addWork(){
 let name=document.getElementById('name').value.trim(),mobile=document.getElementById('mobile').value.trim();
 let work=document.getElementById('work').value.trim(),amount=Number(document.getElementById('amount').value||0);
 let paid=Number(document.getElementById('paid').value||0);
 if(!name||!work){alert('Customer Name और Work/Service भरें।');return}
 if(paid>amount){alert('Paid amount total amount से अधिक नहीं हो सकता।');return}
 data.unshift({id:Date.now(),name,mobile,work,amount,paid,date:new Date().toLocaleString('en-IN')});
 save();clearForm();alert('Work register में save हो गया।');
}
function del(id){if(confirm('यह record delete करें?')){data=data.filter(x=>x.id!==id);save()}}
function markPaid(id){let x=data.find(a=>a.id===id);if(x){x.paid=x.amount;save()}}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function wa(m,t){location.href='https://wa.me/91'+m.replace(/\D/g,'')+'?text='+t}
function render(){
 let q=document.getElementById('search').value.toLowerCase();
 let filtered=data.filter(x=>(x.name+' '+x.mobile+' '+x.work).toLowerCase().includes(q));
 document.getElementById('totalWork').textContent=data.length;
 document.getElementById('totalPaid').textContent=money(data.reduce((s,x)=>s+Number(x.paid||0),0));
 document.getElementById('totalDue').textContent=money(data.reduce((s,x)=>s+Math.max(0,Number(x.amount||0)-Number(x.paid||0)),0));
 let list=document.getElementById('list');
 if(!filtered.length){list.innerHTML='<div class="empty">अभी कोई work record नहीं है।</div>';return}
 list.innerHTML=filtered.map(x=>{
  let due=Math.max(0,x.amount-x.paid),isPaid=due===0;
  return '<div class="item"><div class="item-top"><div class="name">'+esc(x.name)+'</div><span class="badge '+(isPaid?'p':'d')+'">'+(isPaid?'PAID':'DUE ₹'+money(due))+'</span></div>'+
  '<div style="margin-top:7px">📌 '+esc(x.work)+'<br>📱 '+esc(x.mobile||'-')+'<br>💰 Total ₹'+money(x.amount)+' • Paid ₹'+money(x.paid)+'<br><small>'+esc(x.date)+'</small></div>'+
  '<div class="actions">'+(!isPaid?'<button class="green" onclick="markPaid('+x.id+')">✅ Mark Paid</button>':'')+
  (x.mobile?'<button class="gray" onclick="wa(\''+x.mobile+'\',\''+encodeURIComponent('Digital World Computer: '+x.work+' | Due ₹'+due)+'\')">WhatsApp</button>':'')+
  '<button class="red" onclick="del('+x.id+')">🗑 Delete</button></div></div>';
 }).join('');
}
render();
if('serviceWorker' in navigator){navigator.serviceWorker.register('service-worker.js').catch(()=>{})}
</script>
</body>
</html>
